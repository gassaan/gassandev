<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10161A" />
    <!-- The stylesheet only arrives with the bundle, so without this the first
         paint is a white page that then flips to the dark one. Inline, and in
         the head, because it has to win the race the bundle is still running.
         This is the customer-facing page colour; a direct visit to an admin
         URL gets corrected to the admin panel's own black by the synchronous
         script in main.tsx; see the note there. -->
    <style>
      html {
        color-scheme: dark;
        background-color: #10161a;
      }
    </style>
    <title>Salhi Numbers — Premium mobile numbers in the Maldives</title>
    <meta name="description" content="Graded Dhiraagu and Ooredoo mobile numbers in the Maldives. Browse Silver, Gold and Platinum, and order over WhatsApp." />
    <meta property="og:title" content="Salhi Numbers — Premium mobile numbers in the Maldives" />
    <meta property="og:description" content="Graded Dhiraagu and Ooredoo mobile numbers in the Maldives. Browse Silver, Gold and Platinum, and order over WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gassaan.github.io/gassandev/" />
    <!-- Scrapers (WhatsApp, Facebook) need an absolute URL and will not render
         an SVG, so this must stay a fully-qualified PNG. -->
    <meta property="og:image" content="https://gassaan.github.io/gassandev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Archivo:wght@700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Sans+Thaana:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount. If it is still on screen the bundle never
           ran, so it reports why instead of leaving a blank white page. -->
      <div id="boot" style="font-family: ui-sans-serif, system-ui, sans-serif; max-width: 32rem; margin: 15vh auto; padding: 0 1.5rem; text-align: center; color: #D7DFE2;">
        <p id="boot-message" style="font-size: 1rem; color: #8FA3AB;">Loading Salhi Numbers…</p>
        <pre id="boot-error" style="display: none; margin-top: 1rem; padding: 0.75rem; white-space: pre-wrap; word-break: break-word; text-align: left; font-size: 0.75rem; line-height: 1.5; color: #E2837A; background: #182129; border: 1px solid #26333D; border-radius: 0.5rem;"></pre>
      </div>
    </div>
    <script>
      (function () {
        var problems = []
        var shown = false

        // Fatal causes go to the front so the real reason is the first line
        // read, not whichever request happened to fail earliest.
        function record(detail, fatal) {
          if (problems.indexOf(detail) !== -1) return
          if (fatal) problems.unshift(detail)
          else problems.push(detail)
        }

        // Only called for genuinely fatal conditions. A non-critical resource
        // (the webfont stylesheet) failing is recorded as context but must not
        // become the headline, or it masks the real cause.
        function reveal() {
          if (shown) return
          var message = document.getElementById('boot-message')
          var error = document.getElementById('boot-error')
          if (!message || !error) return
          shown = true
          message.textContent = 'Salhi Numbers could not start.'
          message.style.color = '#D7DFE2'
          error.style.display = 'block'
          error.textContent = problems.length
            ? problems.join('\n')
            : 'The page loaded but the app never started, and no error was reported.'
        }

        // Capture phase: resource load failures do not bubble, so a plain
        // listener on window never sees a 404 on the script or stylesheet.
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (target && target !== window && (target.src || target.href)) {
              var fatal = target.tagName === 'SCRIPT'
              record('Failed to load: ' + (target.src || target.href), fatal)
              if (fatal) reveal()
            } else {
              record(event.message || 'Script error', true)
              reveal()
            }
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (event) {
          record('Unhandled promise rejection: ' + event.reason, true)
          reveal()
        })
        setTimeout(function () {
          if (document.getElementById('boot')) reveal()
        }, 10000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
